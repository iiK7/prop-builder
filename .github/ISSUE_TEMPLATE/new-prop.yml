name: بروب جديد
description: ارفع صورة أو موديل GLB ويطلع لك بروب FiveM جاهز
title: "[prop] "
body:
  - type: input
    id: name
    attributes:
      label: Prop name
      description: اسم البروب بالإنجليزي (حروف صغيرة وأرقام و _) مثل estate_sofa_01
      placeholder: estate_sofa_01
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: Type
      description: غرض 3D بالذكاء الاصطناعي، أو منتج مسطح تنلصق صورته عليه (الشعار يطلع واضح)
      options:
        - 3D object (AI)
        - Bag (chips, popcorn)
        - Box (carton)
        - Board (sign, poster, painting)
        - Can (drink can, jar)
        - Room (photo of a whole room)
      default: 0
  - type: input
    id: height
    attributes:
      label: Height (metres)
      description: ارتفاع البروب الحقيقي بالمتر (مثلاً كنب 0.9). للغرفة اكتب المقاس مثل 4x4
      value: "0"
  - type: textarea
    id: file
    attributes:
      label: Image or 3D model
      description: اسحب الصورة هنا (PNG/JPG بخلفية بسيطة) أو ملف .glb
    validations:
      required: true
