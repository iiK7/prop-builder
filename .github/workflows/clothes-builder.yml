name: Clothes builder

# A new texture (colour / logo / pattern) for an existing clothing piece, see tools/prop_builder/clothes_variant.py:
#   clothes_requests/<name>.zip   the piece's files (MP pack or addon ped: .ymt + .ytd/.ydd, any folder layout)
#   clothes_requests/<name>.json  the design (component, drawable, mode, colour / logo / prompt)
# Result on the prop-builds branch: clothes/<name>/ (zip, preview_before.png, preview_after.png, info.json);
# an "analyze" request goes to clothes_analysis/<name>/. A refusal is saved there too (info.json, status failed).
on:
  push:
    paths:
      - 'clothes_requests/**.json'
  workflow_dispatch:
    inputs:
      name:
        description: 'Request name in clothes_requests (<name>.zip + <name>.json)'
        required: true

permissions:
  contents: write

concurrency:
  group: clothes-builder
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CODEWALKER_REF: 485d56bec00262ed7fa472261cce7bbc6202b96e
      DEPS: ${{ github.workspace }}/.clothes-deps
      TOOL: ${{ github.workspace }}/tools/prop_builder
      OUT: ${{ github.workspace }}/out
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/prop_builder
            clothes_requests
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore converter cache
        id: deps
        uses: actions/cache@v4
        with:
          path: .clothes-deps
          key: clothes-deps-${{ env.CODEWALKER_REF }}-${{ hashFiles('tools/prop_builder/cwconv/**') }}

      - name: Build the CodeWalker converter
        if: steps.deps.outputs.cache-hit != 'true'
        run: |
          git init -q "$RUNNER_TEMP/CodeWalker"
          git -C "$RUNNER_TEMP/CodeWalker" fetch -q --depth 1 https://github.com/dexyfex/CodeWalker.git "$CODEWALKER_REF"
          git -C "$RUNNER_TEMP/CodeWalker" checkout -q FETCH_HEAD
          dotnet publish "$TOOL/cwconv/cwconv.csproj" -c Release -o "$DEPS/cwconv" -p:CodeWalkerDir="$RUNNER_TEMP/CodeWalker"

      - name: Install Python packages
        run: pip install -q "pillow>=11.2" numpy "gradio_client>=1.3"

      - name: Read the request
        env:
          IN_NAME: ${{ inputs.name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            f="clothes_requests/$IN_NAME.json"
          else
            f=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- clothes_requests | grep -E '\.json$' | head -1 || true)
          fi
          [ -n "$f" ] && [ -f "$f" ] || { echo "::error::no request json in clothes_requests"; exit 1; }
          name=$(basename "$f" .json)
          [[ "$name" =~ ^[a-z0-9_]{3,40}$ ]] || { echo "::error::bad request name $name (a-z 0-9 _, 3 to 40)"; exit 1; }
          zip="clothes_requests/$name.zip"
          [ -f "$zip" ] || { echo "::error::$zip is missing (upload the zip together with the json)"; exit 1; }
          mode=$(python -c "import json,sys;print(json.load(open(sys.argv[1])).get('mode','tint'))" "$f" 2>/dev/null || echo tint)
          dest=clothes; [ "$mode" = analyze ] && dest=clothes_analysis
          { echo "NAME=$name"; echo "REQ_JSON=$f"; echo "REQ_ZIP=$zip"; echo "MODE=$mode"; echo "DEST=$dest"; } >> "$GITHUB_ENV"
          echo "request $name ($mode), $(du -h "$zip" | cut -f1)"

      - name: Pick a free name
        if: env.DEST == 'clothes'
        run: |
          # a design with this name already exists: add _2, _3, ... so nothing gets overwritten
          taken=$(git fetch -q --depth 1 origin prop-builds 2>/dev/null \
                  && git ls-tree --name-only FETCH_HEAD clothes/ | sed 's|^clothes/||' || true)
          name="$NAME"; n=1
          while grep -qx "$name" <<< "$taken"; do n=$((n + 1)); name="${NAME:0:37}_$n"; done
          if [ "$name" != "$NAME" ]; then
            echo "::notice::$NAME is taken, building as $name"
            echo "NAME=$name" >> "$GITHUB_ENV"
          fi

      - name: Make the new texture
        id: build
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -u "$TOOL/clothes_variant.py" "$REQ_ZIP" "$REQ_JSON" "$OUT/clothes" --cwconv "$DEPS/cwconv/cwconv" --name "$NAME"

      - uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success' && env.DEST == 'clothes'
        with:
          name: clothes-${{ env.NAME }}
          path: |
            out/clothes/${{ env.NAME }}.zip
            out/clothes/preview_*.png
            out/clothes/info.json

      - name: Copy to the prop-builds branch
        if: ${{ !cancelled() && env.NAME != '' }}
        env:
          BUILD: ${{ steps.build.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          repo="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          dir="$RUNNER_TEMP/builds"
          git clone -q --depth 1 --branch prop-builds "$repo" "$dir" 2>/dev/null || {
            git init -q "$dir" && git -C "$dir" checkout -q --orphan prop-builds && git -C "$dir" remote add origin "$repo"; }
          dest="$dir/$DEST/$NAME"
          rm -rf "$dest" && mkdir -p "$dest"
          for f in "$NAME.zip" preview_before.png preview_after.png; do
            [ -f "$OUT/clothes/$f" ] && cp "$OUT/clothes/$f" "$dest/"
          done
          # info.json: what was made (or why it was refused) and which request it answers; never the token
          python - "$dest/info.json" <<'PY'
          import datetime, json, os, sys
          out = os.path.join(os.environ["OUT"], "clothes")
          info = {}
          if os.environ["BUILD"] == "success" and os.path.exists(f"{out}/info.json"):
              info = json.load(open(f"{out}/info.json"))
          else:
              err = json.load(open(f"{out}/error.json")) if os.path.exists(f"{out}/error.json") else {
                  "code": "error", "message": "صار خطأ بالبناء، شوف السجل.", "detail": "build step failed"}
              info = {"name": os.environ["NAME"], "mode": os.environ["MODE"], "status": "failed", "error": err,
                      "built": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%MZ")}
          try:
              spec = json.load(open(os.environ["REQ_JSON"]))
              info["spec"] = {k: v for k, v in spec.items() if k not in ("logo",)}   # the logo picture stays in the request
              if isinstance(spec.get("logo"), dict):
                  info["spec"]["logo"] = {k: v for k, v in spec["logo"].items() if k != "png"}
          except (OSError, ValueError):
              pass
          info.update(name=os.environ["NAME"], request=os.environ["GITHUB_SHA"], source=os.environ["REQ_ZIP"],
                      run=os.environ["RUN_URL"])
          json.dump(info, open(sys.argv[1], "w"), ensure_ascii=False, indent=1)
          print({k: v for k, v in info.items() if k != "summary"})
          PY
          cd "$dir"
          git config user.name "prop-builder"
          git config user.email "prop-builder@users.noreply.github.com"
          git add -A && git commit -qm "Clothes $NAME ($MODE, $BUILD)"
          # another build may have pushed meanwhile: each design has its own folder, so rebase and retry
          for try in 1 2 3 4 5 6; do
            git push -q origin prop-builds && exit 0
            sleep $((try * 3))
            git pull -q --rebase origin prop-builds || { git rebase --abort; echo "::error::could not merge with another build of $NAME"; exit 1; }
          done
          echo "::error::could not save the build after 6 tries"; exit 1

      - name: Fail when the design was refused
        if: steps.build.outcome != 'success'
        run: |
          [ -f "$OUT/clothes/error.json" ] && python -c "import json,sys;e=json.load(open(sys.argv[1]));print('::error::'+e['detail'])" "$OUT/clothes/error.json"
          exit 1
